name: Tests

# Every branch push, so cross-platform results exist before a PR is opened.
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Offline suite; live-network 'integration' tests stay deselected.
    - name: Run tests
      run: uv run --extra dev pytest -q

  extension:
    name: Claude Desktop extension builds
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build the extension
      run: uv run python scripts/build_extension.py

    - name: Committed manifests must already be current
      run: git diff --exit-code manifest.json plugins/scopus-plus-mcp/.claude-plugin/plugin.json server.json

    - uses: actions/upload-artifact@v4
      with:
        name: scopus-plus-mcp-extension
        path: dist/*.mcpb
        retention-days: 14
