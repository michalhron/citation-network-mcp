name: Publish

# On a vX.Y.Z tag: build and upload citation-network-mcp to PyPI, then list
# it in the official MCP registry. Both use GitHub OIDC (no stored tokens):
# PyPI needs a trusted publisher for this repository, workflow publish.yml,
# environment "pypi"; the registry trusts io.github.michalhron/* from this
# repository. release.yml attaches the Claude Desktop extension separately.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Tag must match the package version
      if: github.ref_type == 'tag'
      run: |
        VERSION=$(uv run python -c "import scopus_mcp; print(scopus_mcp.__version__)")
        test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

    - name: Build
      run: uv build

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: MCP registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Wait until PyPI serves this version
      run: |
        VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
        for i in $(seq 1 30); do
          curl -sf "https://pypi.org/pypi/citation-network-mcp/$VERSION/json" >/dev/null && exit 0
          sleep 10
        done
        echo "citation-network-mcp $VERSION not visible on PyPI after 5 minutes"; exit 1

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

    - name: Publish to the MCP registry
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
