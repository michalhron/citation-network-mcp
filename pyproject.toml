[project]
name = "scopus-mcp"
dynamic = ["version"]
description = "A Model Context Protocol server for the Elsevier Scopus API"
readme = "README.md"
authors = [
  {name = "qwe4559999", email = "heyrhao@126.com"},
  {name = "thinktraveller"}
]
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27.0",
    "mcp>=1.0,<2",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "pymupdf>=1.23.0",
    # Windows Credential Manager access for SCOPUS_API_KEY / insttoken.
    # macOS uses the built-in `security` CLI instead; Linux opts in via
    # the 'keyring' extra (Secret Service needs a desktop session).
    "keyring>=24; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/qwe4559999/scopus-mcp"
Documentation = "https://github.com/qwe4559999/scopus-mcp/blob/main/README.md"
Repository = "https://github.com/qwe4559999/scopus-mcp"
Issues = "https://github.com/qwe4559999/scopus-mcp/issues"

[project.optional-dependencies]
keyring = [
    "keyring>=24"
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1"
]

[project.scripts]
scopus-mcp = "scopus_mcp.server:start"

[tool.pytest.ini_options]
# 'integration' tests make real network requests against Elsevier and OpenAlex,
# so they are deselected by default. Run them deliberately with:
#   pytest -m integration
markers = [
    "integration: hits the live network; requires SCOPUS_API_KEY",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/scopus_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scopus_mcp"]
