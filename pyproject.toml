[project]
name = "citation-network-mcp"
dynamic = ["version"]
description = "MCP server for citation-network analysis on Scopus or OpenAlex: coupling, co-citation, lineages, bibliometrics"
readme = "README.md"
authors = [
  {name = "Michal Hron"},
  {name = "qwe4559999", email = "heyrhao@126.com"},
  {name = "thinktraveller"}
]
license = "MIT"
keywords = ["mcp", "scopus", "openalex", "bibliometrics", "citation-network",
            "bibliographic-coupling", "co-citation", "main-path-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27.0",
    "mcp>=1.0,<2",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "pymupdf>=1.23.0",
    # Windows Credential Manager access for SCOPUS_API_KEY / insttoken.
    # macOS uses the built-in `security` CLI instead; Linux opts in via
    # the 'keyring' extra (Secret Service needs a desktop session).
    "keyring>=24; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/michalhron/citation-network-mcp"
Documentation = "https://github.com/michalhron/citation-network-mcp#readme"
Repository = "https://github.com/michalhron/citation-network-mcp"
Issues = "https://github.com/michalhron/citation-network-mcp/issues"

[project.optional-dependencies]
keyring = [
    "keyring>=24"
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1"
]

[project.scripts]
citation-network-mcp = "scopus_mcp.cli:main"
# Alias kept so existing configs that run `scopus-mcp` keep working.
scopus-mcp = "scopus_mcp.cli:main"

[tool.pytest.ini_options]
# 'integration' tests make real network requests against Elsevier and OpenAlex,
# so they are deselected by default. Run them deliberately with:
#   pytest -m integration
markers = [
    "integration: hits the live network; requires SCOPUS_API_KEY",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version lives in __init__.py (hatch dynamic version); rebuild the
# local install when it changes, not only when pyproject.toml does.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/scopus_mcp/__init__.py" }]

[tool.hatch.version]
path = "src/scopus_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scopus_mcp"]
