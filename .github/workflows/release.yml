name: Release

# Push a tag vX.Y.Z matching scopus_mcp.__version__ to publish a GitHub
# Release with the Claude Desktop extension (.mcpb) attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Tag must match the package version
      run: |
        VERSION=$(uv run python -c "import scopus_mcp; print(scopus_mcp.__version__)")
        test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

    - name: Build the extension
      run: uv run python scripts/build_extension.py

    - name: Committed manifests must already be current
      run: git diff --exit-code manifest.json plugins/citation-network-mcp/.claude-plugin/plugin.json server.json

    - name: Publish the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
