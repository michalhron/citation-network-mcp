name: Publish to PyPI

# Manual only. The package is still named scopus-mcp, which on PyPI belongs
# to upstream (qwe4559999/scopus-mcp), so publishing on every version tag
# would push this project under their name. Re-enable a tag trigger once the
# project has its own PyPI name. Version tags now drive release.yml, which
# attaches the Claude Desktop extension to a GitHub Release.
on:
  workflow_dispatch:

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
